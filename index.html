<!DOCTYPE html>
<html lang="en">
<head>

<title>GymBuddy</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
 * { box-sizing: border-box; margin: 0; padding: 0; }

 body {
   background: #f2f2f2;
   color: #111;
   font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
   font-size: 15px;
   padding: 16px;
   min-height: 100vh;
 }

 .brand-header {
   display: flex;
   justify-content: space-between;
   align-items: center;
   margin-bottom: 8px;
 }

 .brand-title {
   font-size: 20px;
   font-weight: 900;
   letter-spacing: -0.02em;
   color: #1c1c1e;
 }

 .user-greeting {
   background: #1c1c1e;
   color: #fff;
   padding: 12px 14px;
   border-radius: 8px;
   font-size: 13px;
   font-weight: 600;
   margin-bottom: 12px;
   display: flex;
   justify-content: space-between;

 }

 .edit-name-btn {
   background: transparent;
   border: none;
   color: #aaa;
   font-size: 11px;
   text-decoration: underline;

 }

 .auth-bar {
   display: flex;
   justify-content: space-between;

   margin-bottom: 16px;

   border-radius: 8px;

 }

 .auth-status {

   font-weight: 600;
   color: #555;
 }

 .sync-status {
   font-size: 11px;
   font-weight: 600;

   text-align: center;
   margin-bottom: 14px;

 }

 .sync-status.offline { color: #b8860b; }
 .sync-status.syncing { color: #1a56a0; }
 .sync-status.synced { color: #1a7f3c; }

 .log-workout-wrap {
   padding: 12px 14px 14px 14px;

   justify-content: center;

 }

 .btn-log {

 h1 {

 .subtitle {

 .progress-bar-wrap {

 }

 .day-block {

 }

 .day-header {
   background: #1c1c1e;
   padding: 11px 14px;
   display: flex;
   align-items: center;

   user-select: none;
 }

 .day-label {
   font-size: 11px;

   text-transform: uppercase;

 }

 .day-title {
   font-size: 13px;
   font-weight: 700;
   color: #fff;
   flex: 1;
 }

 .chevron {

 }

 .day-header.collapsed .chevron { transform: rotate(-90deg); }

 .day-content { display: block; }
 .day-content.hidden { display: none; }

 table {
   width: 100%;

 }

 thead tr {

 }

 thead th {

 thead th.center { text-align: center; }

 tbody tr {

 }

 tbody tr:last-child { border-bottom: none; }

 td {

 }

 .intensity { font-size: 18px; line-height: 1; }

 .exercise-name {

 }

 }

 }

 .ex-link {

 }

 .ex-link:active { opacity: 0.6; }

 .ex-link.anatomy {
   color: #1a56a0;
   border-color: #c2d8f5;
   background: #eef4fd;
 }

 .ex-link.guide {
   color: #7a4500;
   border-color: #f5ddb8;
   background: #fdf5e8;
 }

 .ex-link.trx {
   color: #1a7f3c;
   border-color: #b8e8c8;
   background: #eafaf0;
 }

 .sets-reps {
   font-size: 13px;

   color: #222;
   white-space: nowrap;

 }

 .weight-cell { text-align: center; }

 .weight-input {

   border: 1.5px solid #ccc;

   padding: 6px 6px;
   text-align: center;
   outline: none;
   transition: border-color 0.15s, background 0.15s;

 }

 .weight-input:focus {

 }

 .weight-input::placeholder { color: #aaa; font-weight: 400; font-size: 11px; }

 .sets-cell { text-align: center; }

 .set-dots {
   display: flex;
   flex-direction: column;

 }

 .set-dot {
   width: 26px;
   height: 26px;
   border-radius: 50%;
   border: 2px solid #ccc;
   background: #fff;
   cursor: pointer;
   font-size: 13px;
   font-weight: 700;
   display: inline-flex;
   align-items: center;
   justify-content: center;
   color: transparent;
   transition: all 0.15s;
   flex-shrink: 0;
 }

 .set-dot.checked {
   background: #1a7f3c;
   border-color: #1a7f3c;
   color: #fff;
 }

 .rest-row td {
   padding: 16px 10px;
   text-align: center;
   font-size: 12px;
   font-weight: 700;
   letter-spacing: 0.1em;
   text-transform: uppercase;
   color: #aaa;
   background: #fafafa;
 }

 .action-bar {
   margin-top: 20px;
   display: flex;
   justify-content: center;
   gap: 10px;
 }

 .btn {
   background: #fff;
   border: 1.5px solid #ccc;
   color: #444;
   border-radius: 7px;
   padding: 9px 16px;
   font-size: 12px;
   font-weight: 700;
   letter-spacing: 0.05em;
   cursor: pointer;
   transition: all 0.15s;
 }

 .btn:hover { border-color: #888; color: #111; }
 .btn-primary { background: #1c1c1e; color: #fff; border-color: #1c1c1e; }
 .btn-primary:hover { background: #333; color: #fff; }
</style>

<body>

<div class="brand-header">
  <div class="brand-title">GymBuddy 🏋️</div>
</div>

<div class="user-greeting" id="greetingBar">
  <span id="greetingText">Hello! Have a good day at the gym today buddy!</span>
  <button class="edit-name-btn" onclick="promptUserName()">Edit Name</button>
</div>

<div class="auth-bar">
  <span class="auth-status" id="authStatus">Drive: Disconnected</span>
  <button class="btn btn-primary" id="authBtn" onclick="handleAuth()">Sign in with Google</button>
</div>
<div class="sync-status" id="syncStatus">Saved locally</div>

<h1>High-Volume Upper-Chest &amp; Frame</h1>
<p class="subtitle">Hypertrophy Split — Tap each circle per set</p>

<div class="progress-bar-wrap">
  <div class="progress-bar" id="progressBar"></div>
</div>

<div id="workout"></div>

<div class="action-bar">
  <button class="btn" onclick="exportToCSV()">Export History (.csv)</button>
  <button class="btn" onclick="resetAll()">Reset Session</button>
</div>

<script>
const CLIENT_ID = '845411227594-7vf5h7g7pjcn0rm12art72jr0st5vpjg.apps.googleusercontent.com';

// Build search URLs for each link type
function anatomyUrl(name) {
  return `https://www.google.com/search?q=${encodeURIComponent(name + ' muscle anatomy')}`;
}
function guideUrl(name) {
  return `https://www.google.com/search?q=${encodeURIComponent('how to do ' + name + ' proper form')}`;
}
function trxUrl(name) {
  return `https://www.google.com/search?q=${encodeURIComponent(name + ' TRX suspension trainer alternative')}`;
}

const days = [
  {
    label: "Day 1",
    title: "Push — Pectoral Primary, Deltoids & Triceps",
    exercises: [
      { intensity: "🟡", name: "Incline Dumbbell Bench Press", sets: 4, reps: "8–10", note: "30°–45° incline, upper chest" },
      { intensity: "🔴", name: "Flat Barbell Bench Press", sets: 3, reps: "6–8", note: "Mid-chest thickness" },
      { intensity: "🟢", name: "Incline Dumbbell Flyes", sets: 3, reps: "12", note: "Deep stretch, upper chest isolation" },
      { intensity: "🟡", name: "Seated Dumbbell Shoulder Press", sets: 3, reps: "8–10", note: "Overhead pressing strength" },
      { intensity: "🟢", name: "Overhead Dumbbell Tricep Extension", sets: 3, reps: "12", note: "" },
    ]
  },
  {
    label: "Day 2",
    title: "Pull — Lats, Rhomboids & Posterior Delts",
    exercises: [
      { intensity: "🔴", name: "Barbell Conventional Deadlifts", sets: 3, reps: "5", note: "Posterior chain & systemic load" },
      { intensity: "🟡", name: "Wide-Grip Lat Pulldowns", sets: 4, reps: "8–10", note: "Upper torso width" },
      { intensity: "🟡", name: "Bent-Over Barbell Rows", sets: 3, reps: "8–10", note: "Underhand grip, mid-back thickness" },
      { intensity: "🟢", name: "Dumbbell Shrugs", sets: 3, reps: "12–15", note: "2-second squeeze at top" },
      { intensity: "🟢", name: "Incline Dumbbell Bicep Curls", sets: 3, reps: "10–12", note: "" },
    ]
  },
  {
    label: "Day 3",
    title: "Active Recovery / Rest",
    rest: true
  },
  {
    label: "Day 4",
    title: "Lower Body — Hamstrings, Glutes & Calves",
    exercises: [
      { intensity: "🔴", name: "Barbell Hip Thrusts", sets: 4, reps: "8–10", note: "Heavy posterior loading, vertical shins, zero knee pain" },
      { intensity: "🟡", name: "Romanian Deadlifts (RDLs)", sets: 3, reps: "10", note: "Hip hinge, hamstring & lower back density" },
      { intensity: "🟢", name: "Seated Straight-Leg Raises", sets: 3, reps: "15 per leg", note: "Straight-leg quad isolation, zero joint compression" },
      { intensity: "🟢", name: "Isometric Wall Sits", sets: 3, reps: "30–45 sec hold", note: "Shallow 45° bend, static hold" },
      { intensity: "🟢", name: "Standing Calf Raises", sets: 4, reps: "15", note: "" },
    ]
  },
  {
    label: "Day 5",
    title: "Upper Body Conditioning & Pectoral Definition",
    exercises: [
      { intensity: "🟢", name: "Decline Push-Ups", sets: 3, reps: "Failure", note: "Feet elevated, strict upper pec focus" },
      { intensity: "🟡", name: "Chest Dips", sets: 3, reps: "8–12", note: "Lean forward, lower pec border" },
      { intensity: "🟢", name: "Dumbbell Lateral Raises", sets: 4, reps: "15", note: "Medial delt, lateral shoulder width" },
      { intensity: "🟢", name: "Seated Cable / Machine Rows", sets: 3, reps: "12", note: "" },
      { intensity: "🟢", name: "Rear Delt Flyes", sets: 3, reps: "15", note: "Posterior delt, posture correction" },
    ]
  }
];

let state = {
  userName: '',
  sets: {},
  currentWeights: {},
  exerciseHistory: {},   // quick "last weight used" lookup per exercise, for input placeholders
  workoutLogs: [],       // full dated history — one entry per "Log Workout" press
  updatedAt: null,       // ISO timestamp of last local change, used to resolve sync conflicts
  pendingSync: false     // true whenever local changes haven't been pushed to Drive yet
};

let isOnline = navigator.onLine;
let isSyncing = false;

let accessToken = null;
let driveFileId = null;

function saveLocalState() {
  try { localStorage.setItem('gymbuddy_state', JSON.stringify(state)); } catch(e) {}
}

function loadLocalState() {
  try {
    const s = localStorage.getItem('gymbuddy_state');
    if (s) state = JSON.parse(s);
  } catch(e) {}
}

function updateGreeting() {
  const greetingEl = document.getElementById('greetingText');
  if (state.userName && state.userName.trim() !== '') {
    greetingEl.textContent = `Hello ${state.userName}. Have a good day at the gym today buddy.`;
  } else {
    greetingEl.textContent = `Hello! Have a good day at the gym today buddy.`;
  }
}

function promptUserName() {
  const name = prompt("What's your name?", state.userName || '');
  if (name !== null) {
    state.userName = name.trim();
    touchState();
    updateGreeting();
  }
}

function checkUserFirstLaunch() {
  if (!state.userName) {
    setTimeout(() => { promptUserName(); }, 500);
  }
}

function handleAuth() {
  const tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/drive.appdata',
    callback: async (response) => {
      if (response && response.access_token) {
        accessToken = response.access_token;
        localStorage.setItem('gymbuddy_google_authed', 'true');
        document.getElementById('authStatus').textContent = 'Drive: Connected';
        document.getElementById('authBtn').style.display = 'none';
        updateSyncStatusUI();
        await syncFromDrive();
      }
    },
  });
  tokenClient.requestAccessToken();
}

// Pulls the remote copy and keeps whichever version (local vs. remote) has the
// newer `updatedAt` — protects against overwriting newer local edits made while
// offline, or newer edits made on another device/browser.
async function syncFromDrive() {
  if (!accessToken || !isOnline) { updateSyncStatusUI(); return; }
  isSyncing = true;
  updateSyncStatusUI();
  try {
    const res = await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder', {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    const data = await res.json();
    const file = data.files.find(f => f.name === 'gymbuddy_data.json');
    if (file) {
      driveFileId = file.id;
      const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      const driveState = await fileRes.json();
      const remoteIsNewer = driveState.updatedAt && (!state.updatedAt || driveState.updatedAt > state.updatedAt);
      if (remoteIsNewer) {
        state = { ...state, ...driveState, pendingSync: false };
        saveLocalState();
        updateGreeting();
        renderWorkout();
      } else if (state.pendingSync) {
        // Local has newer (possibly offline-made) changes — push them up instead.
        await saveToDrive();
      }
    } else {
      await saveToDrive();
    }
  } catch(e) {
    console.error('Drive Sync Error', e);
  } finally {
    isSyncing = false;
    updateSyncStatusUI();
  }
}

async function saveToDrive() {
  if (!accessToken || !isOnline) return;
  const metadata = { name: 'gymbuddy_data.json', parents: ['appDataFolder'] };
  const payload = { ...state, pendingSync: false };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
  form.append('file', new Blob([JSON.stringify(payload)], { type: 'application/json' }));
  let url = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
  let method = 'POST';
  if (driveFileId) {
    url = `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=multipart`;
    method = 'PATCH';
  }
  try {
    const res = await fetch(url, { method, headers: { Authorization: `Bearer ${accessToken}` }, body: form });
    const data = await res.json();
    if (data.id) driveFileId = data.id;
    state.pendingSync = false;
    saveLocalState();
  } catch (e) {
    console.error('Drive Save Error — will retry next time we\'re online', e);
    // Leave pendingSync true so we retry on the next connectivity change.
  }
}

// ---- Sync status UI ----
function updateSyncStatusUI() {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  if (!accessToken) {
    el.textContent = 'Saved locally (sign in to back up to Drive)';
    el.className = 'sync-status';
  } else if (isSyncing) {
    el.textContent = 'Syncing…';
    el.className = 'sync-status syncing';
  } else if (!isOnline) {
    el.textContent = 'Offline — changes saved locally, will sync when back online';
    el.className = 'sync-status offline';
  } else if (state.pendingSync) {
    el.textContent = 'Waiting to sync…';
    el.className = 'sync-status offline';
  } else {
    el.textContent = 'Synced';
    el.className = 'sync-status synced';
  }
}

// Call this after every local mutation. Saves locally (always works, offline or not)
// and opportunistically pushes to Drive if we're online and signed in.
function touchState() {
  state.updatedAt = new Date().toISOString();
  state.pendingSync = true;
  saveLocalState();
  updateSyncStatusUI();
  attemptSync();
}

async function attemptSync() {
  if (!accessToken || !isOnline || isSyncing) { updateSyncStatusUI(); return; }
  isSyncing = true;
  updateSyncStatusUI();
  await saveToDrive();
  isSyncing = false;
  updateSyncStatusUI();
}

// ---- Browser connectivity (works offline via localStorage regardless) ----
function initNetworkListener() {
  isOnline = navigator.onLine;
  updateSyncStatusUI();
  window.addEventListener('online', () => {
    const cameOnline = !isOnline;
    isOnline = true;
    updateSyncStatusUI();
    if (cameOnline) attemptSync();
  });
  window.addEventListener('offline', () => {
    isOnline = false;
    updateSyncStatusUI();
  });
}

function updateProgress() {
  const dots = document.querySelectorAll('.set-dot');
  const checked = document.querySelectorAll('.set-dot.checked');
  const pct = dots.length ? (checked.length / dots.length) * 100 : 0;
  document.getElementById('progressBar').style.width = pct + '%';
}

function toggleSet(key, dot) {
  state.sets[key] = !state.sets[key];
  dot.classList.toggle('checked', state.sets[key]);
  dot.textContent = state.sets[key] ? '✓' : '';
  touchState();
  updateProgress();
}

function saveWeight(exName, wKey, val) {
  state.currentWeights[wKey] = val;
  const today = new Date().toISOString().split('T')[0];
  if (val.trim() !== '') {
    state.exerciseHistory[exName] = { weight: val, updatedAt: today };
  }
  touchState();
}

// Called by the "Log Workout" button on a given day. Records a permanent, dated
// entry to state.workoutLogs (never overwritten), updates the quick "last weight"
// lookup used for input placeholders, then clears that day's checkmarks and
// weight fields so it's ready for the next time this day comes around.
function logWorkout(di) {
  const day = days[di];
  if (!day || day.rest) return;

  const today = new Date().toISOString().split('T')[0];
  const entries = [];
  let anySetChecked = false;

  day.exercises.forEach((ex, ei) => {
    const wKey = `w-${di}-${ei}`;
    const inputEl = document.getElementById(`input-${wKey}`);
    const weight = inputEl ? inputEl.value : (state.currentWeights[wKey] || '');

    let setsCompleted = 0;
    for (let s = 0; s < ex.sets; s++) {
      if (state.sets[`s-${di}-${ei}-${s}`]) setsCompleted++;
    }
    if (setsCompleted > 0) anySetChecked = true;

    entries.push({ name: ex.name, weight, setsCompleted, totalSets: ex.sets });

    if (weight && weight.trim() !== '') {
      state.exerciseHistory[ex.name] = { weight, updatedAt: today };
    }
  });

  if (!anySetChecked) {
    const proceed = confirm("No sets are checked off for this day yet. Log it anyway?");
    if (!proceed) return;
  }

  state.workoutLogs.unshift({
    id: `${today}-${di}-${Date.now()}`,
    date: today,
    dayLabel: day.label,
    dayTitle: day.title,
    entries
  });

  // Clear this day's checkmarks and weight fields only — other days are untouched.
  day.exercises.forEach((ex, ei) => {
    for (let s = 0; s < ex.sets; s++) {
      delete state.sets[`s-${di}-${ei}-${s}`];
    }
    delete state.currentWeights[`w-${di}-${ei}`];
  });

  touchState();
  renderWorkout();
  alert(`${day.label} logged for ${today}. Nice work!`);
}

// Exports every logged workout session (one row per exercise per session),
// not just the latest weight — so you get real progression over time.
function exportToCSV() {
  if (!state.workoutLogs || state.workoutLogs.length === 0) {
    alert("No logged workouts yet. Tap 'Log Workout' after a session to start building your history.");
    return;
  }
  let csvContent = "data:text/csv;charset=utf-8,Date,Day,Exercise,Weight,Sets Completed,Total Sets\n";
  // workoutLogs is newest-first; flip to chronological order for the export
  [...state.workoutLogs].reverse().forEach((log) => {
    log.entries.forEach((entry) => {
      const cleanDay = `"${(log.dayLabel + ' — ' + log.dayTitle).replace(/"/g, '""')}"`;
      const cleanName = `"${entry.name.replace(/"/g, '""')}"`;
      const cleanWeight = `"${(entry.weight || '').replace(/"/g, '""')}"`;
      csvContent += `${log.date},${cleanDay},${cleanName},${cleanWeight},${entry.setsCompleted},${entry.totalSets}\n`;
    });
  });
  const encodedUri = encodeURI(csvContent);
  const link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", `gymbuddy_history_${new Date().toISOString().split('T')[0]}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function resetAll() {
  if (!confirm('Reset current session sets? (Historical weights will be preserved)')) return;
  state.sets = {};
  state.currentWeights = {};
  touchState();
  renderWorkout();
}

function autoSignIn() {
  const hasPreviouslyAuthed = localStorage.getItem('gymbuddy_google_authed');
  if (hasPreviouslyAuthed === 'true') {
    document.getElementById('authStatus').textContent = 'Drive: Connected';
    document.getElementById('authBtn').style.display = 'none';
  }
  updateSyncStatusUI();
}

function renderWorkout() {
  loadLocalState();
  updateGreeting();
  const wrap = document.getElementById('workout');
  wrap.innerHTML = '';

  days.forEach((day, di) => {
    const block = document.createElement('div');
    block.className = 'day-block';

    const header = document.createElement('div');
    header.className = 'day-header';
    header.innerHTML = `<span class="day-label">${day.label}</span><span class="day-title">${day.title}</span><span class="chevron">▼</span>`;
    header.onclick = () => {
      const content = block.querySelector('.day-content');
      const collapsed = content.classList.toggle('hidden');
      header.classList.toggle('collapsed', collapsed);
    };
    block.appendChild(header);

    const content = document.createElement('div');
    content.className = 'day-content';

    if (day.rest) {
      const table = document.createElement('table');
      table.innerHTML = `<tbody><tr class="rest-row"><td colspan="5">Rest & Recover</td></tr></tbody>`;
      content.appendChild(table);
    } else {
      const table = document.createElement('table');
      table.innerHTML = `
        <thead>
          <tr>
            <th style="width:30px"></th>
            <th>Exercise</th>
            <th class="center">Reps</th>
            <th class="center">kg / lbs</th>
            <th class="center">Sets</th>
          </tr>
        </thead>
        <tbody id="tbody-${di}"></tbody>
      `;
      content.appendChild(table);

      const tbody = table.querySelector(`#tbody-${di}`);
      day.exercises.forEach((ex, ei) => {
        const wKey = `w-${di}-${ei}`;
        const histEntry = state.exerciseHistory[ex.name];
        const lastWeight = typeof histEntry === 'object' ? histEntry.weight : (histEntry || '');
        const currentWeight = state.currentWeights[wKey] !== undefined ? state.currentWeights[wKey] : lastWeight;

        let dotsHtml = '<div class="set-dots">';
        for (let s = 0; s < ex.sets; s++) {
          const sKey = `s-${di}-${ei}-${s}`;
          const done = state.sets[sKey] || false;
          dotsHtml += `<button class="set-dot ${done ? 'checked' : ''}" onclick="toggleSet('${sKey}', this)">${done ? '✓' : ''}</button>`;
        }
        dotsHtml += '</div>';

        const tr = document.createElement('tr');

        const tdDot = document.createElement('td');
        tdDot.className = 'intensity';
        tdDot.textContent = ex.intensity;

        const tdEx = document.createElement('td');
        const notePart = ex.note ? `<div class="exercise-note">${ex.note}</div>` : '';
        const linksPart = `
          <div class="exercise-links">
            <a class="ex-link anatomy" href="${anatomyUrl(ex.name)}" target="_blank" rel="noopener">🫀 Anatomy</a>
            <a class="ex-link guide" href="${guideUrl(ex.name)}" target="_blank" rel="noopener">📋 Guide</a>
            <a class="ex-link trx" href="${trxUrl(ex.name)}" target="_blank" rel="noopener">🔗 TRX Swap</a>
          </div>`;
        tdEx.innerHTML = `<div class="exercise-name">${ex.name}</div>${notePart}${linksPart}`;

        const tdReps = document.createElement('td');
        tdReps.className = 'sets-reps';
        tdReps.textContent = ex.reps;

        const inp = document.createElement('input');
        inp.className = 'weight-input';
        inp.id = `input-${wKey}`;
        inp.type = 'text';
        inp.inputMode = 'text';
        inp.autocomplete = 'off';
        inp.placeholder = lastWeight ? `Last: ${lastWeight}` : 'e.g. 20/40';
        inp.value = currentWeight;
        inp.addEventListener('change', () => saveWeight(ex.name, wKey, inp.value));

        const tdW = document.createElement('td');
        tdW.className = 'weight-cell';
        tdW.appendChild(inp);

        const tdSets = document.createElement('td');
        tdSets.className = 'sets-cell';
        tdSets.innerHTML = dotsHtml;

        tr.appendChild(tdDot);
        tr.appendChild(tdEx);
        tr.appendChild(tdReps);
        tr.appendChild(tdW);
        tr.appendChild(tdSets);
        tbody.appendChild(tr);
      });

      const logWrap = document.createElement('div');
      logWrap.className = 'log-workout-wrap';
      const logBtn = document.createElement('button');
      logBtn.className = 'btn btn-log';
      logBtn.textContent = '✓ Log Workout';
      logBtn.onclick = () => logWorkout(di);
      logWrap.appendChild(logBtn);
      content.appendChild(logWrap);
    }

    block.appendChild(content);
    wrap.appendChild(block);
  });

  updateProgress();
  checkUserFirstLaunch();
}

window.addEventListener('load', () => {
  renderWorkout();
  initNetworkListener();
  autoSignIn();
});
</script>
</body>
</html>
